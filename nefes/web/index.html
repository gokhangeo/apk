<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nefes</title>
<style>
:root {
  --text: #eef1f7; --muted: #9aa3b5; --faint: #6b7385;
  --glass: rgba(255,255,255,.05); --glass2: rgba(255,255,255,.09); --line: rgba(255,255,255,.1); --track: rgba(255,255,255,.1);
  --danger: #ff6b6b; --ok: #6ee0a0; --warn: #ffcf6e;
  --serif: Georgia, "Noto Serif", serif; --ease: cubic-bezier(.2,.8,.2,1);
  --accent: #7cc4ff; --nav: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #0b1226; color: var(--text); font: 15px/1.45 system-ui, "Roboto", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
small { color: var(--muted); display: block; font-size: 12.5px; }
b { font-weight: 600; }
h4 { margin: 20px 0 8px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.muted { color: var(--faint); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button, select, input { font: inherit; color: var(--text); }
button { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; transition: transform .15s var(--ease), background .2s, opacity .2s; }
button:active:not(:disabled) { transform: scale(.96); background: var(--glass2); }
button:disabled { opacity: .45; }
button.sm { padding: 6px 12px; font-size: 13px; }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
.pill { background: #fff; color: #0d1220; border: 0; font-weight: 600; padding: 13px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.pill.danger { background: var(--danger); color: #fff; }
input.search { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; outline: none; width: 100%; }
input.search:focus { border-color: var(--accent); }
select { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; }
select option { background: #1a1f2b; }

/* kabuk */
.app { position: relative; height: 100%; display: flex; flex-direction: column; }
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
.bg.on { opacity: 1; }
.bg-clean { background: radial-gradient(900px 700px at 50% 35%, #1a3a7a 0%, #0f2152 35%, #0b1226 75%); }
.bg-uninstall { background: radial-gradient(900px 700px at 50% 35%, #6b1e14 0%, #3a0f0c 40%, #1d0a0a 80%); }
.bg-startup { background: radial-gradient(900px 700px at 50% 35%, #5a2460 0%, #331437 40%, #1c0f1f 80%); }
.bg-analyze { background: radial-gradient(900px 700px at 50% 35%, #0f5a52 0%, #0a3330 40%, #061b1a 80%); }
.bg-trash { background: radial-gradient(900px 700px at 50% 35%, #3a4152 0%, #1f2430 40%, #10131a 80%); }
.bg-status { background: radial-gradient(900px 700px at 50% 30%, #4d2a12 0%, #2a1a10 40%, #15100c 80%); }
.stars { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 12%, #fff, transparent),
    radial-gradient(1px 1px at 35% 78%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 64%, #fff, transparent),
    radial-gradient(1px 1px at 55% 35%, #fff, transparent), radial-gradient(1px 1px at 8% 88%, #fff, transparent),
    radial-gradient(1px 1px at 92% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 22% 52%, #fff, transparent); }
.top { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 14px 18px 6px; flex: none; }
.logo { display: flex; align-items: center; gap: 8px; font: 500 17px var(--serif); }
.logo i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition: background .6s; }
.top .title { margin-left: auto; color: var(--muted); font-size: 13px; }
.stage { position: relative; z-index: 1; flex: 1; min-height: 0; }
.page { position: absolute; inset: 0; display: none; flex-direction: column; }
.page.on { display: flex; animation: pageIn .45s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
nav { position: relative; z-index: 4; flex: none; display: flex; height: var(--nav); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: rgba(8,10,18,.72); border-top: 1px solid var(--line); backdrop-filter: blur(14px); }
nav button { flex: 1; border: 0; background: transparent; border-radius: 14px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
nav button.on { color: var(--text); background: rgba(255,255,255,.08); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.p-earth { background: radial-gradient(circle at 35% 35%, #7fd0ff, #1a56a8 60%, #0b2a6b); }
.p-mars { background: radial-gradient(circle at 35% 35%, #f0a36b, #b4441f 60%, #3d0f08); }
.p-venus { background: radial-gradient(circle at 35% 35%, #fff0f6, #c27bb8 60%, #3b1640); }
.p-jupiter { background: repeating-linear-gradient(0deg, #bfe8d4 0 2px, #1f6f63 2px 4px); }
.p-moon { background: radial-gradient(circle at 35% 35%, #f3f4f6, #9aa0ab 60%, #3a3e46); }
.p-sun { background: radial-gradient(circle, #fff4c4, #ffa531 55%, #ec6a17); box-shadow: 0 0 6px #ffa531; }
nav button.on .dot { box-shadow: 0 0 10px var(--accent); }

/* tablet: yan menü */
@media (min-width: 720px) {
  .app { flex-direction: row; flex-wrap: wrap; }
  .top { width: 100%; padding: 16px 26px 4px; }
  nav { order: -1; flex-direction: column; justify-content: flex-start; width: 96px; height: auto; padding: 70px 10px 20px; margin-top: -54px; border-top: 0; border-right: 1px solid var(--line); background: rgba(8,10,18,.4); gap: 6px; }
  nav button { flex: none; height: 72px; font-size: 12px; }
  .dot { width: 16px; height: 16px; }
  .stage { height: calc(100% - 54px); flex: 1; }
  .wrap { padding-left: 28px !important; padding-right: 28px !important; }
  .grid2 { grid-template-columns: 1fr 1fr !important; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important; }
}

/* gezegen ve karşılama */
.planet { position: relative; border-radius: 50%; flex: none; }
.planet::before { content: ""; position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--glow) 38%, transparent) 30%, transparent 68%); filter: blur(6px); z-index: -1; animation: breathe 5s ease-in-out infinite; }
.planet canvas { display: block; border-radius: 50%; }
@keyframes breathe { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px 30px; text-align: center; }
.hero-planet { position: relative; display: grid; place-items: center; animation: floaty 7s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.orbit { position: absolute; inset: -26px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); animation: spin 6s linear infinite; }
.orbit i { position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.tagline { margin: 6px 0 2px; font: italic 17px/1.55 var(--serif); color: #dfe5f1; opacity: .92; }
.live { font: 15px system-ui; color: var(--text); }
.hero .sub { color: var(--muted); font-size: 12.5px; max-width: 90%; }

/* listeler */
.wrap { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 120px; -webkit-overflow-scrolling: touch; }
.head { display: flex; align-items: center; gap: 14px; padding: 6px 16px 10px; flex: none; }
.headline { font: 400 26px/1.15 var(--serif); }
.headline span { font: 14px system-ui; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 8px; }
.row.sel { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--glass)); }
.row .grow { flex: 1; min-width: 0; }
.icon { width: 40px; height: 40px; border-radius: 10px; flex: none; object-fit: contain; }
.icon.letter { display: grid; place-items: center; font-weight: 700; color: #fff; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 10.5px; color: var(--warn); background: rgba(255,207,110,.1); border: 1px solid rgba(255,207,110,.25); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.tag.soft { color: var(--muted); background: var(--glass); border-color: var(--line); }
.tag.ok { color: var(--ok); background: rgba(110,224,160,.1); border-color: rgba(110,224,160,.3); }
.tag.bad { color: var(--danger); background: rgba(255,107,107,.1); border-color: rgba(255,107,107,.3); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; flex: none; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { white-space: nowrap; padding: 6px 13px; font-size: 13px; }
.chips button.on { background: rgba(255,255,255,.9); color: #0d1220; border-color: transparent; }
.tools { display: flex; gap: 8px; padding: 0 16px 10px; flex: none; align-items: center; }
.check { width: 22px; height: 22px; padding: 0; border-radius: 7px; flex: none; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); }
.check svg { width: 15px; height: 15px; fill: none; stroke: #0d1220; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { opacity: 1; }
.empty { color: var(--muted); padding: 40px 10px; text-align: center; }
.banner { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; margin: 0 16px 10px; background: color-mix(in srgb, var(--accent) 12%, rgba(0,0,0,.25)); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); flex: none; }
.banner .grow { flex: 1; font-size: 13.5px; }
.note { padding: 12px 14px; border-radius: 14px; background: rgba(0,0,0,.22); border: 1px solid var(--line); color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.note b { color: var(--text); }
.bar { height: 6px; border-radius: 6px; background: var(--track); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .6s var(--ease); }
.actionbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 18px; border-radius: 999px; background: rgba(14,18,28,.82); border: 1px solid var(--line); backdrop-filter: blur(18px); box-shadow: 0 20px 50px rgba(0,0,0,.45); z-index: 5; white-space: nowrap; transition: transform .4s var(--ease), opacity .3s; max-width: calc(100% - 24px); }
.actionbar.hidden { transform: translate(-50%, 160%); opacity: 0; pointer-events: none; }
.actionbar > span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.actionbar .pill { padding: 11px 20px; }
.cat { border-radius: 16px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 10px; overflow: hidden; }
.cat-top { display: flex; align-items: center; gap: 12px; padding: 14px; }
.cat-top .grow { flex: 1; min-width: 0; }
.cat-size { font: 500 15px var(--serif); white-space: nowrap; }
.files { border-top: 1px solid var(--line); max-height: 320px; overflow: auto; }
.file { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.04); }
.file .grow { flex: 1; min-width: 0; }
.crumbs { display: flex; gap: 4px; align-items: center; overflow-x: auto; padding: 0 16px 10px; flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; scrollbar-width: none; }
.crumbs span { padding: 4px 8px; border-radius: 8px; background: var(--glass); }
.crumbs span:last-child { color: var(--text); }
.fbar { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 16px; pointer-events: none; transition: width .6s var(--ease); }
.row.rel { position: relative; overflow: hidden; }
.row.rel > *:not(.fbar) { position: relative; }
.fi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.07); flex: none; font-size: 17px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { padding: 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card .big { font: 400 24px var(--serif); }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring circle { transition: stroke-dashoffset .7s var(--ease); }
.ring .lbl { position: absolute; font: 500 16px var(--serif); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.kv span:first-child { color: var(--muted); }
.spark { width: 100%; height: 44px; display: block; }
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow: auto; background: rgba(20,22,32,.97); border: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); animation: up .3s var(--ease); }
@media (min-width: 720px) { .sheet-back { align-items: center; } .sheet { border-radius: 24px; } }
.sheet h3 { margin: 0 0 8px; font: 500 20px var(--serif); }
.sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; justify-content: flex-end; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + 80px); transform: translateX(-50%); z-index: 30; padding: 11px 18px; border-radius: 14px; background: rgba(14,18,28,.94); border: 1px solid var(--line); font-size: 13.5px; max-width: 90%; text-align: center; animation: up .3s var(--ease); }
.toast.ok { border-color: rgba(110,224,160,.4); }
.toast.err { border-color: rgba(255,107,107,.45); }
.spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -2px; }
.stagger { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
.upd-hero { text-align: center; padding: 6px 0 4px; }
.upd-hero .badge { display: inline-block; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #0d1220; background: var(--accent); border-radius: 999px; padding: 3px 10px; font-weight: 700; }
.upd-hero h3 { font-size: 24px !important; margin: 12px 0 2px !important; }
.upd-notes { margin: 14px 0 4px; padding: 0; list-style: none; }
.upd-notes li { position: relative; padding: 8px 0 8px 26px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
.upd-notes li::before { content: "✦"; position: absolute; left: 4px; top: 8px; color: var(--accent); }
.upd-bar { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; margin-top: 14px; }
.upd-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #fff); transition: width .2s; }
.sheet .acts.col { flex-direction: column; align-items: stretch; }
.sheet .acts.col button { width: 100%; }

/* ---------- yeni bölümler: Kalkan, Kişiler, Temizle alt sekmeleri ---------- */
.bg-kalkan { background: radial-gradient(900px 700px at 50% 30%, #23306e 0%, #151d47 40%, #0a0f26 80%); }
.bg-kisiler { background: radial-gradient(900px 700px at 50% 30%, #5a2346 0%, #33142a 40%, #1a0b16 80%); }
nav { overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { min-width: 58px; }
@media (min-width: 720px) { nav { overflow-x: visible; overflow-y: auto; } nav button { min-width: 0; height: 64px !important; } }
/* ilk açılıştan sonra giriş animasyonu bir daha oynamaz: kaydırırken/seçerken öğeler kaybolup belirmez */
.sabit .stagger { animation: none !important; }
.row.tap, .fcard, .ozet, .th, .sms { transition: transform .18s var(--ease), background .2s, border-color .2s; }
.row.tap:active, .fcard:active, .ozet:active, .sms:active { transform: scale(.985); background: var(--glass2); }

/* bölüm içi sekmeler (segment) */
.seg { position: relative; display: flex; margin: 2px 16px 10px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.22); border: 1px solid var(--line); flex: none; }
.seg button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; padding: 8px 4px; font-size: 13px; color: var(--muted); border-radius: 999px; white-space: nowrap; transition: color .25s; }
.seg button.on { color: #0d1220; font-weight: 600; }
.seg > i { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: 0 6px 18px rgba(0,0,0,.3); transition: transform .38s var(--ease), width .38s var(--ease); }
.panes { position: relative; flex: 1; min-height: 0; }
.pane { position: absolute; inset: 0; display: none; flex-direction: column; }
.pane.on { display: flex; animation: paneIn .32s var(--ease); }
@keyframes paneIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.mini-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.25); border: 1px solid var(--line); gap: 2px; flex: none; }
.mini-seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 12px; color: var(--muted); }
.mini-seg button.on { background: var(--accent); color: #0d1220; font-weight: 600; }
.mini-seg button.on.kirmizi { background: var(--danger); color: #fff; }

/* özet kartları */
.ozet3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.ozet { text-align: left; border-radius: 18px; padding: 12px; background: var(--glass); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; color: var(--text); }
.ozet.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 12%, var(--glass)); }
.ozet .oi { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; background: rgba(255,255,255,.08); }
.ozet b { font: 500 17px var(--serif); }
.ozet small { font-size: 11.5px; }
.ozet .bar { height: 4px; margin-top: 4px; }

/* küçük resim ızgarası */
.tg { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.th { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 2px solid transparent; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .35s ease, transform .25s var(--ease); }
.th img.ok { opacity: 1; }
.th img.hata { display: none; }
.th:active { transform: scale(.96); }
.th.on { border-color: var(--accent); }
.th.on img { transform: scale(.92); border-radius: 8px; }
.th-c { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); background: rgba(0,0,0,.25); display: grid; place-items: center; transition: background .2s, transform .2s var(--ease); }
.th-c svg { width: 13px; height: 13px; fill: none; stroke: #0d1220; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.th.on .th-c { background: var(--accent); border-color: var(--accent); transform: scale(1.08); }
.th.on .th-c svg { opacity: 1; }
.th-b { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 4px; font-size: 10.5px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.th-a { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--ok); color: #06210f; }
.th-f { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; opacity: .55; }
.daha { display: block; margin: 12px auto 0; }

/* klasör kartları */
.fcard { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 8px; position: relative; overflow: hidden; }
.fcard .grow { flex: 1; min-width: 0; }
.fcard .cat-size { text-align: right; }
.fcard .bar { height: 4px; margin-top: 7px; }
.fcard.sel { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--glass)); }

const ikon = (x) => x.ikon ? `<img class="icon" src="${x.ikon}" alt="">` : harfIkon(x.ad);

/* ---------- Gezegen (masaüstündeki dönen gezegenin hafif sürümü) ---------- */
function hash(x, y, z, s) { let h = (x * 374761393 + y * 668265263 + z * 2147483647 + s * 144665) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

      document.documentElement.style.setProperty('--accent', c.renk || s.renk);

      const ilk = !this.kuruldu; this.kur(); const c = this.cocuk();
      document.documentElement.style.setProperty('--accent', c.renk || this.renk);
      if (ilk || !c.el.innerHTML || c.goster) c.goster ? c.goster() : c.ciz();
    },

    geri() {

      return false;
    },
    boyutlandi() { for (const [, , c] of this.alt) if (c.durum === 'giris' && c.el && c.el.innerHTML) c.ciz(); },
  }, o);
}

const DOSYA_FILTRE = [['hepsi', 'Tümü'], ['g30', '30+ gün'], ['g90', '90+ gün'], ['b10', '10 MB+']];
const dosyaIkon = (ad) => { const u = (ad.split('.').pop() || '').toLowerCase();
  return /^(jpe?g|png|webp|gif|heic|bmp)$/.test(u) ? '🖼️' : /^(mp4|3gp|mkv|webm|mov|avi)$/.test(u) ? '🎬' : /^(opus|mp3|m4a|aac|ogg|wav|amr)$/.test(u) ? '🎙️'
    : /^(pdf|docx?|xlsx?|pptx?|txt|csv)$/.test(u) ? '📄' : /^(zip|rar|7z|tar|gz)$/.test(u) ? '🗜️' : u === 'apk' ? '📦' : '📎'; };
const dosyaGrubu = {
  filtrele(g, f) {
    if (f === 'g30') return g.dosyalar.filter((d) => gunEski(d.tarih, 30));
    if (f === 'g90') return g.dosyalar.filter((d) => gunEski(d.tarih, 90));
    if (f === 'b10') return g.dosyalar.filter((d) => d.boyut >= 10 * 1048576);
    if (f === 'eskiApk') return g.dosyalar.filter((d) => d.eski);
    return g.dosyalar;
  },
  // s: sayfa; gruplar: [{id, ad, ikon, alt, toplam, sayi, dosyalar, bolum?, kopya?}]
  ciz(s, { baslik, altBaslik, gruplar, ustNot = '', bosMetin }) {
    const acik = gruplar.find((g) => g.id === s.acik);
    if (!acik) {
      const enb = Math.max(1, ...gruplar.map((g) => g.toplam));
      let son = null, i = 0;
      const kartlar = gruplar.map((g) => {
        const tum = g.dosyalar.length && g.dosyalar.every((d) => s.secili.has(d.yol)), biri = g.dosyalar.some((d) => s.secili.has(d.yol));
        const bolum = g.bolum && g.bolum !== son ? `<h4>${esc(g.bolum)}</h4>` : ''; son = g.bolum;
        return `${bolum}<div class="fcard stagger ${biri ? 'sel' : ''}" data-g="${esc(g.id)}" style="--i:${Math.min(i++, 14)}">
          <button class="check ${tum ? 'on' : ''}" data-gc="${esc(g.id)}" style="${biri && !tum ? 'opacity:.6' : ''}" ${g.dosyalar.length ? '' : 'disabled'}>${CHECK}</button>
          <span class="ic">${g.ikon}</span>
          <div class="grow"><b class="ell" style="display:block">${esc(g.ad)}</b><small class="ell">${esc(g.alt || `${g.sayi.toLocaleString('tr-TR')} dosya`)}</small>
            <div class="bar"><i style="width:${(g.toplam / enb * 100).toFixed(1)}%"></i></div></div>
          <div class="cat-size">${bytes(g.toplam)}</div><span class="chev">›</span></div>`;
      }).join('');
      s.el.innerHTML = `
        <div class="head"><div class="grow"><div class="headline">${baslik}</div><small>${altBaslik}</small></div><button class="sm" data-a="yeniden">Yeniden tara</button></div>
        <div class="wrap">${ustNot}${gruplar.length ? kartlar : bos('🌿', 'Temiz', bosMetin)}</div>
        <div class="actionbar hidden"><span data-v="secim"></span><button class="pill danger" data-a="sil">Sil</button></div>`;
      s.el.querySelectorAll('[data-g]').forEach((el) => el.onclick = (e) => {
        const g = gruplar.find((x) => x.id === el.dataset.g);
        if (e.target.closest('[data-gc]')) {
          const tum = g.dosyalar.every((d) => s.secili.has(d.yol));
          g.dosyalar.forEach((d) => tum ? s.secili.delete(d.yol) : (!d.asil && s.secili.set(d.yol, d.boyut)));
          yerindeCiz(s);
        } else { s.acik = g.id; s.filtre = 'hepsi'; s.limit = 200; s.ciz(); const w = $('.wrap', s.el); if (w) w.scrollTop = 0; }
      });
    } else {
      const g = acik, filtreler = g.apk ? [['hepsi', 'Tümü'], ['eskiApk', 'Kurulu / bozuk']] : g.kopya ? [['hepsi', 'Tümü']] : DOSYA_FILTRE;
      const l = dosyaGrubu.filtrele(g, s.filtre || 'hepsi');
      const lb = l.reduce((t, d) => t + d.boyut, 0);
      const satir = (d, i) => `<div class="row tap stagger ${s.secili.has(d.yol) ? 'sel' : ''}" data-y="${esc(d.yol)}" data-b="${d.boyut}" style="--i:${Math.min(i, 14)}">
          <button class="check ${s.secili.has(d.yol) ? 'on' : ''}">${CHECK}</button>
          ${d.kucuk ? `<img class="fthumb" loading="lazy" decoding="async" src="${esc(d.kucuk)}" alt="">` : `<span class="fi">${dosyaIkon(d.ad)}</span>`}
          <div class="grow"><div class="ell">${esc(d.ad)}</div><small class="ell">${tarih(d.tarih)}${d.neden ? ' · ' + esc(d.neden) : ''}${g.kopya || g.yolGoster ? ' · ' + esc(d.yol.replace(/^\/storage\/emulated\/0\//, '')) : ''}</small>
            ${d.asil ? '<div class="tags"><span class="tag ok">Asıl · kalır</span></div>' : ''}</div>
          <span class="muted" style="white-space:nowrap">${bytes(d.boyut)}</span></div>`;
      s.el.innerHTML = `
        <div class="head"><button class="geri-btn" data-a="kapat">‹</button><div class="grow"><div class="headline" style="font-size:22px">${esc(g.ad)}</div>
          <small>${l.length.toLocaleString('tr-TR')} dosya · ${bytes(lb)}${g.kesik ? ' · en büyük 6000 dosya gösteriliyor' : ''}</small></div></div>
        <div class="chips">${filtreler.map(([k, ad]) => `<button class="${(s.filtre || 'hepsi') === k ? 'on' : ''}" data-f="${k}">${ad}</button>`).join('')}</div>
        <div class="wrap">
          ${l.length ? `<div class="arac"><button class="sm" data-a="gorunen">${g.kopya ? 'Kopyaları seç' : 'Bunları seç'}</button><button class="sm ghost" data-a="hic">Seçimi kaldır</button></div>
          <div class="grid2">${l.slice(0, s.limit).map(satir).join('')}</div>
          ${l.length > s.limit ? `<button class="daha" data-a="daha">${l.length - s.limit} dosya daha göster</button>` : ''}`
          : bos('🍃', 'Bu filtrede dosya yok', 'Başka bir filtre deneyin.')}
        </div>
        <div class="actionbar hidden"><span data-v="secim"></span><button class="pill danger" data-a="sil">Sil</button></div>`;
      s.el.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { s.filtre = b.dataset.f; s.limit = 200; yerindeCiz(s); });
      s.el.querySelectorAll('[data-y]').forEach((r) => r.onclick = () => {
        const y = r.dataset.y; s.secili.has(y) ? s.secili.delete(y) : s.secili.set(y, +r.dataset.b);
        const on = s.secili.has(y); r.classList.toggle('sel', on); $('.check', r).classList.toggle('on', on); dosyaGrubu.bar(s);
      });
      const on = (a, f) => { const b = $(`[data-a=${a}]`, s.el); if (b) b.onclick = f; };
      on('kapat', () => { s.acik = null; s.ciz(); });
      on('gorunen', () => { l.forEach((d) => !d.asil && s.secili.set(d.yol, d.boyut)); dosyaGrubu.secimYenile(s); });
      on('hic', () => { l.forEach((d) => s.secili.delete(d.yol)); dosyaGrubu.secimYenile(s); });
      on('daha', () => { s.limit += 400; yerindeCiz(s); });
    }
    const y = $('[data-a=yeniden]', s.el); if (y) y.onclick = () => s.tara();
    $('[data-a=sil]', s.el).onclick = () => dosyaGrubu.sil(s);
    dosyaGrubu.bar(s);
  },
  secimYenile(s) {
    s.el.querySelectorAll('[data-y]').forEach((r) => { const on = s.secili.has(r.dataset.y); r.classList.toggle('sel', on); $('.check', r).classList.toggle('on', on); });
    dosyaGrubu.bar(s);
  },
  bar(s) {
    const bar = $('.actionbar', s.el); if (!bar) return;
    let b = 0; s.secili.forEach((x) => b += x);
    bar.classList.toggle('hidden', !s.secili.size);
    $('[data-v=secim]', bar).textContent = `${s.secili.size} dosya · ${bytes(b)}`;
  },
  async sil(s) {
    const n = s.secili.size; let b = 0; s.secili.forEach((x) => b += x);
    const secim = await silSor({ baslik: `${n} dosya silinecek`, metin: `<p>Toplam ${bytes(b)}. Çöp kutusuna taşınanlar 30 gün geri alınabilir; kalıcı silmek hemen yer açar.</p>` });
    if (!secim) return;
    const yollar = [...s.secili.keys()];
    let r; try { r = await cagir('sil', JSON.stringify(yollar), secim === 'cop'); } catch (e) { toast(e.message, 'err'); return; }
    silSonucu(r);
    SAYFALAR.analyze && (SAYFALAR.analyze.kirli = true);
    if (r.hata) { s.secili.clear(); s.tara(); return; }
    s.secili.clear(); s.kaldir(new Set(yollar)); yerindeCiz(s);
  },
};

  },
  kaldir(gitti) {
    for (const g of this.veri.gruplar) { g.dosyalar = g.dosyalar.filter((d) => !gitti.has(d.yol)); g.toplam = g.dosyalar.reduce((t, d) => t + d.boyut, 0); g.sayi = g.dosyalar.length; }
    this.veri.gruplar = this.veri.gruplar.filter((g) => g.sayi > 0);
    this.veri.toplam = this.veri.gruplar.reduce((t, g) => t + g.toplam, 0);
  },
  async tara() {
    const s = this; s.durum = 'tariyor'; s.ilerleme = ''; s.ciz();
    dinleyici.whatsapp = (p) => { s.ilerleme = p.metin; const el = $('.sub', s.el); if (el) el.textContent = p.metin; };
    try { s.veri = await cagir('whatsappTara'); s.secili.clear(); s.acik = null; s.durum = 'liste'; }
    catch (e) { toast(e.message, 'err'); s.durum = 'giris'; }
    s.ciz();
  },
  resume() { if (this.durum === 'giris') this.ciz(); },
  geri() {
    if (this.secili.size) { this.secili.clear(); this.acik ? dosyaGrubu.secimYenile(this) : yerindeCiz(this); return true; }

    on('guncelle', () => s.guncelle(true));
    on('temizle', async () => { if (await onayla({ baslik: 'Günlük temizlensin mi?', metin: '<p>Durdurulan aramaların listesi silinir.</p>', ok: 'Temizle' })) { A.gunlukTemizle('arama'); yerindeCiz(s); } });
    on('ekle', () => {
      const no = $('[data-i=no]', s.el).value.trim(), et = $('[data-i=etiket]', s.el).value.trim();
      if (!no) { toast('Önce bir numara yazın.', 'err'); return; }
      const r = jsonOku(() => A.kendiEkle(no, et, s.yeniMod), { hata: 'Eklenemedi' });
      if (r.hata) { toast(r.hata, 'err'); return; }
      toast(`${r.goster} listeye eklendi.`, 'ok'); yerindeCiz(s);
    });
    s.el.querySelectorAll('[data-ayar]').forEach((b) => b.onclick = () => { const v = !b.classList.contains('on'); b.classList.toggle('on', v); A.kalkanAyar(b.dataset.ayar, v ? '1' : '0'); });
    s.el.querySelectorAll('[data-paket]').forEach((g) => g.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => {
      g.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); A.kalkanAyar(g.dataset.paket, b.dataset.m);
    }));
    const yg = $('[data-yeni]', s.el); yg.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { s.yeniMod = b.dataset.m; yg.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); });
    s.el.querySelectorAll('[data-sil]').forEach((b) => b.onclick = () => { A.kendiSil(b.dataset.sil); yerindeCiz(s); });
  },
  async guncelle(elle) {
    const s = this; if (s.guncelleniyor) return; s.guncelleniyor = !!elle; if (elle) yerindeCiz(s);
    try { const r = await cagir('spamGuncelle', !!elle); if (elle) toast(`Ortak liste güncellendi · ${r.sayi} numara.`, 'ok'); }
    catch (e) { if (elle) toast('Güncellenemedi: ' + e.message, 'err'); }
    s.guncelleniyor = false;
    if (aktif === 'kalkan' && SAYFALAR.kalkan.aktifAlt === 'arama') yerindeCiz(s);
  },
  resume() { yerindeCiz(this); },
};

/* ================= KİŞİLER ================= */
const KISILER = {
  ad: 'Kişiler', gezegen: 'venus', renk: '#f3a6d0', ust: '#1a0b16',
  durum: 'giris', veri: null, secili: new Map(), bolum: 'kopya',
  ciz() {
    const s = this;
    if (s.durum === 'giris') {
      const iz = izin();
      const b = hero(s, { satirlar: ['Rehber sade,', 'bağlar net.'], dugme: iz.rehber && iz.rehberYaz ? 'Kişileri tara' : 'Rehber izni ver' });
      b.onclick = () => iz.rehber && iz.rehberYaz ? s.tara() : A.izinIste('rehberYaz');
      $('.hero', s.el).insertAdjacentHTML('beforeend', '<div class="sub">Aynı ad ya da aynı numarayla kayıtlı kopya kişileri ve numarası, e-postası olmayan boş kişileri bulur. Birleştirme yapılmaz; güvenli kopyalar silinir.</div>');
      return;
    }
    if (s.durum === 'tariyor') { hero(s, { mesgul: true, durum: 'Rehber okunuyor…' }); return; }
    if (s.durum === 'siliyor') { hero(s, { mesgul: true, durum: 'Kişiler siliniyor…', alt: s.ilerleme || '' }); return; }
    const v = s.veri;
    const kisiSatir = (k, grupAsil) => `<div class="kisi ${s.secili.has(k.lookup) ? 'sel' : ''}" data-k="${esc(k.lookup)}" data-id="${k.id}">
        <button class="check ${s.secili.has(k.lookup) ? 'on' : ''}" ${k.asil ? 'disabled style="opacity:.25"' : ''}>${CHECK}</button>${avatar(k.ad)}
        <div class="grow"><b class="ell" style="display:block">${esc(k.ad)}</b><small class="ell">${esc([...k.numaralar, ...k.epostalar].join(' · ') || 'Bilgi yok')}</small>
          <div class="tags">${k.asil ? '<span class="tag ok">Saklanacak</span>' : k.guvenli ? '<span class="tag soft">Bilgisi asılda var · güvenli</span>' : grupAsil ? '<span class="tag">Farklı bilgi var · gözden geçirin</span>' : ''}${k.yildiz ? '<span class="tag soft">★ Favori</span>' : ''}</div></div></div>`;
    const icerik = s.bolum === 'kopya'
      ? (v.gruplar.length ? `<div class="arac"><button class="sm" data-a="guvenli">Güvenli kopyaları seç (${v.guvenliSayi})</button><button class="sm ghost" data-a="hic">Seçimi kaldır</button></div>` +
        v.gruplar.map((g, i) => `<div class="cat stagger" style="--i:${Math.min(i, 14)}"><div class="grp-bas"><div class="grow"><b>${esc(g.kisiler[0].ad)}</b><small>${g.kisiler.length} kayıt</small></div><span class="tag soft">${esc(g.neden)}</span></div>
          ${g.kisiler.map((k) => kisiSatir(k, true)).join('')}</div>`).join('')
        : bos('🤝', 'Kopya kişi yok', 'Rehberinizde aynı ad ya da numarayla iki kayıt bulunamadı.'))
      : (v.bos.length ? `<div class="arac"><button class="sm" data-a="bosHepsi">Hepsini seç</button><button class="sm ghost" data-a="hic">Seçimi kaldır</button></div><div class="cat">${v.bos.map((k) => kisiSatir(k, false)).join('')}</div>`
        : bos('📇', 'Boş kişi yok', 'Numarası ya da e-postası olmayan kayıt bulunamadı.'));
    s.el.innerHTML = `
      <div class="head"><div class="grow"><div class="headline">${v.kopyaSayi + v.bos.length} <span>kayıt gözden geçirilebilir</span></div><small>Rehberde ${v.toplam} kişi</small></div><button class="sm" data-a="yeniden">Yeniden tara</button></div>
      <div class="wrap">
        <div class="ozet3" style="grid-template-columns:1fr 1fr">
          <button class="ozet stagger ${s.bolum === 'kopya' ? 'on' : ''}" data-bol="kopya"><span class="oi">👥</span><small>Kopya kişiler</small><b>${v.kopyaSayi}</b><small>${v.gruplar.length} grup · ${v.guvenliSayi} güvenli</small></button>
          <button class="ozet stagger ${s.bolum === 'bos' ? 'on' : ''}" data-bol="bos" style="--i:1"><span class="oi">🫥</span><small>Boş kişiler</small><b>${v.bos.length}</b><small>numara ve e-posta yok</small></button>
        </div>
        ${icerik}
        <div class="note" style="margin-top:12px">Silinen kişiler bağlı hesaptan (ör. Google) da silinir. Google Kişiler'de 30 gün içinde <b>Çöp kutusu</b>ndan geri alınabilir.</div>
      </div>
      <div class="actionbar hidden"><span data-v="secim"></span><button class="pill danger" data-a="sil">Sil</button></div>`;
    s.bar();
    s.el.querySelectorAll('[data-bol]').forEach((b) => b.onclick = () => { s.bolum = b.dataset.bol; yerindeCiz(s); });
    s.el.querySelectorAll('.kisi[data-k]').forEach((r) => r.onclick = () => {
      if ($('.check', r).disabled) { toast('Asıl kayıt saklanır; silinecekleri yanındakilerden seçin.'); return; }
      const k = r.dataset.k; s.secili.has(k) ? s.secili.delete(k) : s.secili.set(k, +r.dataset.id);
      const on = s.secili.has(k); r.classList.toggle('sel', on); $('.check', r).classList.toggle('on', on); s.bar();
    });
    const on = (a, f) => { const b = $(`[data-a=${a}]`, s.el); if (b) b.onclick = f; };
    on('yeniden', () => s.tara());
    on('sil', () => s.sil());
    on('guvenli', () => { v.gruplar.forEach((g) => g.kisiler.forEach((k) => k.guvenli && !k.asil && s.secili.set(k.lookup, k.id))); s.secimYenile(); });
    on('bosHepsi', () => { v.bos.forEach((k) => s.secili.set(k.lookup, k.id)); s.secimYenile(); });
    on('hic', () => { s.secili.clear(); s.secimYenile(); });
  },
  secimYenile() { this.el.querySelectorAll('.kisi[data-k]').forEach((r) => { const on = this.secili.has(r.dataset.k); r.classList.toggle('sel', on); $('.check', r).classList.toggle('on', on); }); this.bar(); },
  bar() {
    const bar = $('.actionbar', this.el); if (!bar) return;
    bar.classList.toggle('hidden', !this.secili.size);
    $('[data-v=secim]', bar).textContent = `${this.secili.size} kişi seçili`;
  },
  async tara() {
    const s = this; s.durum = 'tariyor'; s.ciz();
    try { s.veri = await cagir('kisilerTara'); s.secili.clear(); s.durum = 'liste'; }
    catch (e) { toast(e.message, 'err'); s.durum = 'giris'; }
    s.ciz();
  },
  async sil() {
    const s = this, n = s.secili.size;
    if (!izin().rehberYaz) { A.izinIste('rehberYaz'); return; }
    if (!await onayla({ baslik: `${n} kişi silinsin mi?`, metin: '<p>Seçilen kayıtlar rehberden ve bağlı hesaptan silinir. Asıl kayıtlar olduğu gibi kalır.</p>', ok: 'Kişileri sil', tehlike: true })) return;
    const liste = [...s.secili].map(([lookup, id]) => ({ lookup, id }));
    s.durum = 'siliyor'; s.ilerleme = ''; s.ciz();
    dinleyici.kisiSil = (p) => { const el = $('.sub', s.el); if (el) el.textContent = `${p.i} / ${p.n}`; };
    try { const r = await cagir('kisileriSil', JSON.stringify(liste)); toast(`${r.silinen} kişi silindi${r.hata ? `, ${r.hata} kişi silinemedi` : ''}.`, r.hata ? 'err' : 'ok'); }
    catch (e) { toast(e.message, 'err'); }
    s.secili.clear(); s.tara();
  },
  resume() { if (this.durum === 'giris') this.ciz(); },
  geri() { if (this.secili.size) { this.secili.clear(); this.secimYenile(); return true; } return false; },
};

        if (b.dataset.x === 'kaldir') { s.kuyruk = [a.pkg]; s.siradaki(); }
      });

  async topluKaldir() {
    const s = this, n = s.secili.size;
    if (!await onayla({ baslik: `${n} uygulama kaldırılacak`, metin: '<p>Android her uygulama için kendi onay penceresini sırayla açacak.</p>', ok: 'Başlat', tehlike: true })) return;
    s.kuyruk = [...s.secili]; s.secili.clear(); s.siradaki();
  },
  siradaki() {
    const s = this;
    if (!s.kuyruk || !s.kuyruk.length) { s.kuyruk = null; s.yukle(); return; }
    s.bekleyen = s.kuyruk.shift();
    A.kaldir(s.bekleyen);
  },
  resume() {
    const s = this;
    if (s.bekleyen) {
      const p = s.bekleyen; s.bekleyen = null;
      const a = s.liste.find((x) => x.pkg === p);
      if (!A.yuklu(p)) { toast(`${a ? a.ad : p} kaldırıldı.`, 'ok'); s.liste = s.liste.filter((x) => x.pkg !== p); }
      setTimeout(() => s.siradaki(), 350);
      return;
    }
    if (s.boyutBekle) { s.boyutBekle = false; s.yukle(); return; }
    if (s.durum === 'liste') s.yenidenCiz();
  },
  geri() { if (this.secili.size) { this.secili.clear(); this.yenidenCiz(); return true; } return false; },
};

  ad: 'Durum', gezegen: 'sun', renk: '#ffa24c', ust: '#15100c',
  tarih: { ram: [], cpu: [] }, zaman: 0, kurulu: false,
  ring(id, boy = 84) {
    const r = (boy - 9) / 2, c = 2 * Math.PI * r;
    return `<div class="ring" style="width:${boy}px;height:${boy}px"><svg width="${boy}" height="${boy}"><circle cx="${boy / 2}" cy="${boy / 2}" r="${r}" stroke="var(--track)" stroke-width="8" fill="none"/>
      <circle data-r="${id}" cx="${boy / 2}" cy="${boy / 2}" r="${r}" stroke="var(--accent)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><div class="lbl" data-v="${id}Y">—</div></div>`;
  },
  halka(id, v, renk, metin) {
    const el = $(`[data-r="${id}"]`, this.el); if (!el) return;
    const c = parseFloat(el.getAttribute('stroke-dasharray'));

    return `<polygon points="${pts[0][0]},30 ${line} ${pts[pts.length - 1][0]},30" fill="var(--accent)" fill-opacity=".18"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;

/* ---------- Güncelleme ---------- */
function surumAdi() { try { return 'Sürüm ' + JSON.parse(A.surum()).ad; } catch { return ''; } }

// Anlık arayüz güncellemesi: köprüsü uyumlu yeni index.html indirilince uygun anda yeniden yüklenir

const GUN = { kur: false };
function notListesi(md) {
  const satir = String(md || '').split('\n').map((x) => x.trim()).filter(Boolean);
  const madde = satir.filter((x) => /^[-*•]\s+/.test(x)).map((x) => x.replace(/^[-*•]\s+/, ''));
  const liste = madde.length ? madde : satir;
  return liste.map((x) => `<li>${esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`).join('');
}
async function guncellemeDenetle(elle) {
