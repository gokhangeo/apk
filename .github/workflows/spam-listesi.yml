name: Spam listesi
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: ["nefes/ek-liste.json", "nefes/topla.py"]
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 nefes/topla.py
      - run: |
          git config user.name "nefes-bot"; git config user.email "nefes-bot@users.noreply.github.com"
          git add nefes/spam-listesi.json
          git diff --cached --quiet || (git commit -m "Spam listesi güncellendi" && git push)
